[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-evidence-graph"
version = "0.1.0"
description = "A LangGraph retrieval graph that returns cited, freshness-checked evidence instead of synthesised answers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Manohar Sitapati" }]
keywords = ["rag", "langgraph", "retrieval-augmented-generation", "citations", "evidence", "qdrant"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Indexing",
]
dependencies = ["langgraph>=1.2,<2"]

[project.optional-dependencies]
# Durable checkpoints. Without this extra only the in-memory saver is available.
sqlite = ["langgraph-checkpoint-sqlite>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
rag-evidence-graph = "langgraph_rag.adapter:main"

[project.urls]
Homepage = "https://github.com/TheManohar/rag-evidence-graph"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "requires_host_module: test needs a sibling module from the original host deployment (skipped elsewhere)",
]
